<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You’re invited to join RestroSync</title>
  </head>
  <body style="margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px">
          <tr><td style="padding:32px">
            <p style="margin:0 0 24px;color:#2563eb;font-size:20px;font-weight:700">RestroSync</p>
            <h1 style="margin:0 0 12px;font-size:26px;line-height:1.25">You’ve been invited</h1>
            <p style="margin:0 0 24px;color:#475569;font-size:16px;line-height:1.6">A restaurant owner invited you to join their RestroSync workspace. Use the secure button below to accept the invitation.</p>
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=invite&amp;next={{ .RedirectTo }}" style="display:inline-block;border-radius:10px;background:#2563eb;color:#ffffff;padding:13px 20px;text-decoration:none;font-size:15px;font-weight:700">Accept invitation</a>
            <p style="margin:24px 0 0;color:#64748b;font-size:13px;line-height:1.5">If you weren’t expecting this invitation, you can safely ignore this email.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
